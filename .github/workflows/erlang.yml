name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:

  # -------------------------------------------------------------------------
  # Erlang path: compile + xref + dialyzer + eunit across the supported OTP
  # range. Floor is OTP 27: bitcask_embedder_util uses the stdlib `json`
  # module (27+), and the NIF is C++23 — the erlang:<ver> docker images for
  # 22–25 ship gcc 8–10 and can't build it, so we use setup-beam on
  # ubuntu-24.04 (gcc 13) instead. rebar3 comes from setup-beam; the repo
  # no longer vendors ./rebar3.
  # -------------------------------------------------------------------------
  eunit:
    name: eunit (OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        otp: ["27", "28"]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3.24.0"
      # libbitcask 6.3+ 新增 ICU 依赖：BITCASK_ICU_PROVIDER=auto 走系统 ICU
      # 开发包；vendored 回落（380 MB，update=none 被 --recursive 跳过）在 CI
      # 不可行，系统包是唯一路。
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libicu-dev
      # rebar.config 的 configure hook 见到 PATH 上的 ccache 就设成 launcher。
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: eunit-otp${{ matrix.otp }}
      # dialyzer 的 PLT 冷建要几分钟；按 OTP 版本 + 依赖锁定缓存。
      - name: Cache dialyzer PLT
        uses: actions/cache@v4
        with:
          path: _build/default/*_plt
          key: plt-otp${{ matrix.otp }}-${{ hashFiles('rebar.lock', 'rebar.config') }}
          restore-keys: plt-otp${{ matrix.otp }}-
      - name: Compile
        run: rebar3 compile
      - name: Run xref and dialyzer
        run: rebar3 do xref, dialyzer
      - name: Run eunit
        run: rebar3 eunit

  # -------------------------------------------------------------------------
  # C++ NIF: Release build + ctest. Matrix exercises GCC and Clang against
  # the OTP version we ship against (headers are pulled via setup-beam).
  # -------------------------------------------------------------------------
  cpp:
    name: cpp ${{ matrix.compiler }} OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        otp: ["27", "28"]
        compiler: ["gcc", "clang"]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3.22.1"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libicu-dev
      - name: Pick compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"  >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"  >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-${{ matrix.compiler }}-otp${{ matrix.otp }}
      # ⚠️ 不开 -DBITCASK_WERROR=ON：它是 libbitcask 的选项，会连上游源码一起
      #    -Werror，GCC 14 在 libbitcask 的 keydir.cpp 上报 -Wmaybe-uninitialized
      #    （误报），CI 必挂。上游代码不归本仓库管；本仓库 NIF 的警告靠本地
      #    构建输出盯着（当前为 0）。
      - name: Configure
        run: |
          cmake -S . -B _build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build _build/cmake --parallel "$(nproc)"
      - name: Run ctest
        working-directory: _build/cmake
        run: ctest --output-on-failure -j

  # -------------------------------------------------------------------------
  # Sanitizers. Each is its own job so a flake on one doesn't mask the rest.
  # ASan + UBSan share a build (compatible); TSan is exclusive with ASan.
  # The NIF .so is built without sanitizers (would crash BEAM); only the
  # gtest binaries link them. We therefore only run ctest in these jobs.
  # -------------------------------------------------------------------------
  asan:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2"
          rebar3-version: "3.22.1"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libicu-dev
      - name: Configure
        run: |
          cmake -S . -B _build/asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBITCASK_SANITIZE=address,undefined
      - name: Build
        run: cmake --build _build/asan --parallel "$(nproc)"
      - name: Run ctest
        working-directory: _build/asan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --output-on-failure -j

  tsan:
    name: TSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2"
          rebar3-version: "3.22.1"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libicu-dev
      - name: Configure
        run: |
          cmake -S . -B _build/tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBITCASK_SANITIZE=thread
      - name: Build
        run: cmake --build _build/tsan --parallel "$(nproc)"
      - name: Run ctest
        working-directory: _build/tsan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --output-on-failure -j

  # -------------------------------------------------------------------------
  # Coverage: gcov + lcov. Reports a percentage in the run summary; not
  # uploading to codecov to avoid third-party tokens. Threshold is advisory.
  # -------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2"
          rebar3-version: "3.22.1"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build lcov libicu-dev
      - name: Configure
        run: |
          cmake -S . -B _build/cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build _build/cov --parallel "$(nproc)"
      - name: Run ctest
        working-directory: _build/cov
        run: ctest --output-on-failure -j
      - name: Collect coverage
        run: |
          lcov --capture --directory _build/cov --output-file coverage.info \
               --ignore-errors mismatch,gcov,unused
          lcov --remove coverage.info '*/_deps/*' '*/_build/*' '/usr/*' \
               --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info | tee coverage-summary.txt
      - name: Print summary
        run: |
          echo "## C++ coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info
